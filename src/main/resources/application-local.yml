# 로컬에 직접 설치한 PostgreSQL에 붙는다 (docker-compose 연동 제거됨).
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:timmy_todo}
    username: ${DB_USERNAME:timmy}
    password: ${DB_PASSWORD:timmy}

  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  config: classpath:logback-local.xml
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
